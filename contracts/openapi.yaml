    AnalysisTask:
      type: object
      required:
      - taskId
      - type
      - status
      - createdAt
      description: |
        Tác vụ AI bất đồng bộ. Khởi tạo trả 202 trong < 500 ms; FE polling `GET /analysis-tasks/{taskId}` (khoảng 1 giây/lần)
        cho tới `completed` hoặc `failed`. Mục tiêu hoàn tất < 5 giây.
      properties:
        taskId:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/AnalysisTaskType'
        status:
          $ref: '#/components/schemas/AnalysisTaskStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        resultId:
          $ref: '#/components/schemas/Id'
        result:
          description: 'Có khi status = completed. Kiểu kết quả theo `type`: cv_analysis→CvAnalysisResult, jd_analysis→JdAnalysisResult,
            matching→MatchingResult, screening→ScreeningResult, job_recommendation→RecommendedJobList.'
          oneOf:
          - $ref: '#/components/schemas/CvAnalysisResult'
          - $ref: '#/components/schemas/JdAnalysisResult'
          - $ref: '#/components/schemas/MatchingResult'
          - $ref: '#/components/schemas/ScreeningResult'
          - $ref: '#/components/schemas/RecommendedJobList'
        error:
          $ref: '#/components/schemas/AnalysisTaskError'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      example:
        taskId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        type: matching
        status: processing
        progress: 60
        createdAt: '2026-10-14T03:00:00Z'
