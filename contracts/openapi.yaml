          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - CV
      operationId: uploadCv
      summary: Tải lên CV
      description: |-
        Tải CV dạng PDF hoặc DOCX (giới hạn dung lượng ở `GET /catalog/meta` → `cv.maxSizeBytes`). Sau khi tải, FE có thể gọi `POST /cvs/{cvId}/analysis`.

        **Quyền:** Ứng viên.

        **Lỗi nghiệp vụ:**
        - `413 CV_FILE_TOO_LARGE`: Tệp vượt giới hạn dung lượng.
        - `422 CV_INVALID_FORMAT`: Không phải PDF/DOCX hợp lệ hoặc tệp hỏng.
      security:
      - cookieAuth: []
        csrfToken: []
      x-roles:
      - candidate
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF hoặc DOCX.
                title:
                  type: string
                  maxLength: 150
                setAsDefault:
                  type: boolean
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cv'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
