components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT trong cookie httpOnly do BFF gắn. Không dùng phía trình duyệt.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Bắt buộc cho request thay đổi dữ liệu (POST/PUT/PATCH/DELETE) có xác thực.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Cookie làm mới phiên.
  parameters:
    Page:
      name: page
      in: query
      description: Trang (từ 1).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Số phần tử mỗi trang.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Khóa chống gửi trùng (UUID do client sinh).
      schema:
        type: string
        maxLength: 128
  responses:
    BadRequest:
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Chưa đăng nhập hoặc phiên đã hết hạn (UNAUTHENTICATED, SESSION_EXPIRED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Không đủ quyền hoặc CSRF token không hợp lệ (FORBIDDEN, CSRF_TOKEN_INVALID).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Không tìm thấy tài nguyên, hoặc không thuộc quyền truy cập của người gọi (NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Xung đột trạng thái hoặc dữ liệu trùng (CONFLICT và các mã nghiệp vụ).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Tệp hoặc nội dung vượt giới hạn (PAYLOAD_TOO_LARGE, CV_FILE_TOO_LARGE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: Định dạng không được hỗ trợ (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Dữ liệu không hợp lệ; chi tiết ở error.fieldErrors (VALIDATION_FAILED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Locked:
      description: Tài khoản đang bị khóa (ACCOUNT_LOCKED); error.details.lockedUntil cho biết thời điểm mở khóa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      headers:
        Retry-After:
          description: Số giây nên chờ trước khi thử lại.
          schema:
            type: integer
    TooManyRequests:
      description: Vượt giới hạn tần suất (RATE_LIMITED); xem header Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      headers:
        Retry-After:
          description: Số giây nên chờ trước khi thử lại.
          schema:
            type: integer
    InternalError:
      description: Lỗi hệ thống (INTERNAL_ERROR). Thông điệp chung, không lộ chi tiết kỹ thuật.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Dịch vụ tạm thời không khả dụng (SERVICE_UNAVAILABLE), ví dụ AI service quá tải.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      headers:
        Retry-After:
          description: Số giây nên chờ trước khi thử lại.
          schema:
            type: integer
  schemas:
    Role:
      type: string
      enum:
      - candidate
      - recruiter
      - admin
      description: Vai trò. Khi đăng ký chỉ được chọn candidate hoặc recruiter.
    AccountStatus:
      type: string
      enum:
      - active
      - locked
      description: Trạng thái tài khoản. locked = bị admin khóa hoặc bị khóa tạm do đăng nhập sai nhiều lần.
    JobStatus:
      type: string
      enum:
      - draft
      - pending_review
      - rejected
      - open
      - paused
      - closed
      - hidden
      - locked
      description: |
        Trạng thái tin tuyển dụng.
        - draft: nháp. pending_review: chờ admin kiểm duyệt. rejected: admin từ chối.
        - open: đang tuyển (hiển thị công khai). paused: tạm dừng. closed: đã đóng.
        - hidden: admin ẩn. locked: admin khóa (vi phạm).
    ApplicationStatus:
