      - bug
      description: Báo cáo vi phạm hoặc phản hồi từ người dùng.
    ReportTargetType:
      type: string
      enum:
      - job
      - company
      - user
      - application
      - system
    NotificationType:
      type: string
      enum:
      - application_submitted
      - application_status_changed
      - application_withdrawn
      - interview_invited
      - interview_updated
      - interview_cancelled
      - interview_response
      - interview_result
      - job_recommended
      - job_moderated
      - company_verification
      - account_locked
      - report_update
      - ai_task_completed
      - system
    Gender:
      type: string
      enum:
      - male
      - female
      - other
    ErrorCode:
      type: string
      description: |
        Mã lỗi nghiệp vụ ổn định. FE ánh xạ `code` sang thông điệp tiếng Việt, không hiển thị `message` thô nếu chưa qua ánh xạ.
        | Nhóm | Mã |
        |---|---|
        | Chung | VALIDATION_FAILED, BAD_REQUEST, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, CSRF_TOKEN_INVALID, SERVICE_UNAVAILABLE, INTERNAL_ERROR |
        | Tài khoản | EMAIL_ALREADY_EXISTS, INVALID_CREDENTIALS, ACCOUNT_LOCKED, SESSION_EXPIRED, INVALID_RESET_TOKEN, CURRENT_PASSWORD_INCORRECT |
        | CV | CV_INVALID_FORMAT, CV_FILE_TOO_LARGE, CV_UNREADABLE, CV_IN_USE |
        | AI | JD_INSUFFICIENT, AI_ANALYSIS_FAILED, AI_TASK_NOT_READY |
        | Tuyển dụng | JOB_CLOSED, JOB_NOT_OPEN, ALREADY_APPLIED, APPLICATION_NOT_WITHDRAWABLE, INVALID_STATUS_TRANSITION, COMPANY_REQUIRED, COMPANY_NOT_VERIFIED |
        | Phỏng vấn | INTERVIEW_TIME_CONFLICT, INTERVIEW_ALREADY_RESPONDED |
        | Danh mục | CATALOG_ITEM_IN_USE |
      enum:
      - VALIDATION_FAILED
      - BAD_REQUEST
      - UNAUTHENTICATED
      - FORBIDDEN
      - NOT_FOUND
      - CONFLICT
      - RATE_LIMITED
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - CSRF_TOKEN_INVALID
      - SERVICE_UNAVAILABLE
      - INTERNAL_ERROR
      - EMAIL_ALREADY_EXISTS
      - INVALID_CREDENTIALS
      - ACCOUNT_LOCKED
      - SESSION_EXPIRED
      - INVALID_RESET_TOKEN
      - CURRENT_PASSWORD_INCORRECT
      - CV_INVALID_FORMAT
      - CV_FILE_TOO_LARGE
      - CV_UNREADABLE
      - CV_IN_USE
      - JD_INSUFFICIENT
      - AI_ANALYSIS_FAILED
      - AI_TASK_NOT_READY
      - JOB_CLOSED
      - JOB_NOT_OPEN
      - ALREADY_APPLIED
      - APPLICATION_NOT_WITHDRAWABLE
      - INVALID_STATUS_TRANSITION
      - COMPANY_REQUIRED
      - COMPANY_NOT_VERIFIED
      - INTERVIEW_TIME_CONFLICT
      - INTERVIEW_ALREADY_RESPONDED
      - CATALOG_ITEM_IN_USE
    Id:
      type: string
      format: uuid
    FieldError:
      type: object
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          description: Đường dẫn trường lỗi, ví dụ `email` hoặc `educations[0].school`.
          example: email
        code:
          type: string
          example: EMAIL_ALREADY_EXISTS
        message:
          type: string
          description: Thông điệp tiếng Việt, nói rõ lỗi và cách sửa.
          example: Email này đã được sử dụng.
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Thông điệp an toàn để hiển thị. Không bao giờ chứa stack trace hay câu SQL.
            fieldErrors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
            requestId:
              type: string
              description: Mã truy vết, người dùng có thể gửi cho bộ phận hỗ trợ.
            retryAfterSeconds:
              type: integer
              description: Gợi ý thời gian chờ trước khi thử lại (429, 423, 503).
            details:
              type: object
              additionalProperties: true
              description: Dữ liệu bổ sung theo mã lỗi. Ví dụ ACCOUNT_LOCKED có `lockedUntil`.
      example:
        error:
          code: VALIDATION_FAILED
          message: Dữ liệu không hợp lệ.
          requestId: req_01HZX
          fieldErrors:
          - field: email
            code: EMAIL_ALREADY_EXISTS
            message: Email này đã được sử dụng.
    PageMeta:
      type: object
      required:
