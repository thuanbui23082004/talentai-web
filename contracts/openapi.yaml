      - suspended
      description: unverified=chưa gửi hồ sơ xác thực, pending=chờ kiểm duyệt, verified=đã xác thực, rejected=bị từ chối,
        suspended=bị đình chỉ do vi phạm.
    AnalysisTaskType:
