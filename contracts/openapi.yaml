# TalentAI API contract. NGUỒN SỰ THẬT DUY NHẤT cho API.
# Sửa file này trước, sau đó chạy `npm run gen:api`.
openapi: 3.0.3
info:
  title: TalentAI API
  version: 1.0.0
  license:
    name: UNLICENSED
  description: |
    Hợp đồng API của **TalentAI** – nền tảng tuyển dụng tích hợp AI phân tích CV, phân tích JD và đối sánh CV–JD.
    Ba vai trò: **Ứng viên** (`candidate`), **Nhà tuyển dụng** (`recruiter`), **Quản trị viên** (`admin`).

    ## Quy ước chung
    - **Định tuyến:** FE chỉ gọi `/api/bff/*` (BFF). BFF chuyển tiếp sang backend `{BACKEND_URL}/api/v1/*` hoặc trả dữ liệu mock (theo `DATA_MODE`). Đường dẫn trong file này giống nhau ở cả hai phía.
    - **Xác thực:** JWT lưu trong cookie `httpOnly` `access_token` (+ `refresh_token`), do BFF gắn. FE không đọc hay lưu token. Phiên hết hạn sau **30 phút không thao tác**.
    - **CSRF:** mọi request `POST/PUT/PATCH/DELETE` có xác thực phải gửi header `X-CSRF-Token` (lấy từ `login` hoặc `GET /auth/csrf`).
    - **Khóa tài khoản:** đăng nhập sai quá 5 lần liên tiếp trong 10 phút → khóa tạm 15 phút (`423 ACCOUNT_LOCKED`).
    - **Phân quyền:** mỗi operation có `x-roles`. Backend là nơi quyết định cuối cùng; người dùng chỉ truy cập được dữ liệu của chính mình (hoặc của doanh nghiệp mình).
    - **Định dạng:** JSON UTF-8. ID là UUID. Thời gian ISO 8601 UTC (`date-time`); ngày thuần là `date`. Tiền là số nguyên (VNĐ không có phần lẻ).
    - **Trường không bắt buộc** vắng mặt khi không có giá trị; backend không trả `null`.
    - **Phân trang:** query `page` (từ 1) và `pageSize` (mặc định 20, tối đa 100). Response danh sách có dạng `{ items, meta: { page, pageSize, totalItems, totalPages } }`.
    - **Lỗi:** mọi lỗi có dạng `{ error: { code, message, fieldErrors?, requestId, details? } }` (xem `ApiError`, `ErrorCode`). Không bao giờ lộ stack trace hay SQL.
    - **Tác vụ AI bất đồng bộ:** `POST` khởi tạo trả `202` + `AnalysisTask` (< 500 ms). Theo dõi bằng `GET /analysis-tasks/{taskId}` đến khi `completed`/`failed` (mục tiêu < 5 giây).
    - **Idempotency:** `POST /applications` và `POST /recruiter/interviews` hỗ trợ header `Idempotency-Key` để chống gửi trùng khi retry.
    - **Tệp:** CV chỉ nhận PDF/DOCX. Tải tệp qua endpoint có xác thực, không có URL công khai.
    - **Mock:** ở `DATA_MODE=mock`, BFF nhận header `x-mock-scenario` (`empty|slow|error|unauthorized|forbidden|conflict|locked`) để ép kịch bản. Header này không có trong backend thật.
    - **AI hỗ trợ, không thay thế quyết định:** kết quả AI là gợi ý kèm giải thích. Không tự động loại ứng viên hoặc tin tuyển dụng.
servers:
- url: /api/bff
  description: BFF (FE luôn gọi địa chỉ này)
- url: '{backendUrl}/api/v1'
  description: Backend thật (chỉ BFF gọi)
  variables:
    backendUrl:
      default: http://localhost:8000
tags:
- name: Auth
  description: Đăng ký, đăng nhập, đăng xuất, mật khẩu, CSRF.
- name: Account
  description: 'Tài khoản của chính người dùng: thông tin, ảnh đại diện, xuất dữ liệu, xóa tài khoản.'
- name: Candidate Profile
  description: 'Hồ sơ cá nhân ứng viên: học vấn, kinh nghiệm, kỹ năng, chứng chỉ, công việc mong muốn, dashboard.'
- name: CV
  description: 'Quản lý CV: tải lên, tạo, phiên bản, tải về, xóa.'
- name: AI Analysis
  description: Phân tích CV và JD bằng AI; theo dõi tác vụ bất đồng bộ.
- name: AI Matching
  description: Đối sánh CV–JD, Matching Score, AI gợi ý việc làm.
- name: Jobs
  description: Tìm kiếm, lọc, xem chi tiết việc làm.
- name: Companies
  description: Hồ sơ doanh nghiệp công khai.
- name: Saved Jobs & History
  description: Việc làm đã lưu, đã xem, lịch sử tìm kiếm.
- name: Applications
  description: Ứng tuyển và theo dõi hồ sơ (phía ứng viên).
- name: Candidate Interviews
  description: Lời mời và lịch phỏng vấn (phía ứng viên).
- name: Recruiter Company
  description: Quản lý thông tin doanh nghiệp của nhà tuyển dụng.
- name: Recruiter Jobs
  description: Quản lý tin tuyển dụng và JD.
- name: Recruiter Candidates
  description: Xem, lọc, sàng lọc ứng viên; AI hỗ trợ sàng lọc; cập nhật trạng thái.
- name: Recruiter Interviews
  description: Tạo, gửi, đổi, hủy lịch phỏng vấn và ghi kết quả.
- name: Recruiter Stats
  description: Thống kê tuyển dụng.
- name: Notifications
  description: Thông báo trong ứng dụng và tùy chọn nhận thông báo.
- name: Reports
  description: Người dùng gửi báo cáo vi phạm hoặc phản hồi.
- name: Catalog
  description: 'Danh mục công khai: ngành nghề, vị trí, kỹ năng, địa điểm và enum.'
- name: Admin Users
  description: Quản lý tài khoản người dùng.
- name: Admin Companies
  description: Kiểm tra, xác thực, xử lý doanh nghiệp.
- name: Admin Jobs
  description: Kiểm duyệt tin tuyển dụng.
- name: Admin Catalog
  description: Quản lý danh mục.
- name: Admin Reports
  description: Xử lý báo cáo và phản hồi.
- name: Admin Monitoring
  description: Nhật ký hoạt động, nhật ký hệ thống, hoạt động bất thường.
- name: Admin Stats
  description: Thống kê và chỉ số hệ thống.
- name: System
  description: Kiểm tra sức khỏe hệ thống.
security:
- cookieAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Đăng ký tài khoản
      description: |-
        Tạo tài khoản Ứng viên hoặc Nhà tuyển dụng. Kiểm tra định dạng email, độ mạnh mật khẩu, mật khẩu xác nhận và email trùng. Mật khẩu được băm Bcrypt. Không tự đăng nhập sau khi đăng ký. Nhà tuyển dụng có thể ở trạng thái chờ kiểm duyệt doanh nghiệp.

        **Quyền:** công khai (không cần đăng nhập).

        **Lỗi nghiệp vụ:**
        - `409 EMAIL_ALREADY_EXISTS`: Email đã được sử dụng; kèm fieldErrors[email].
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Đăng nhập
      description: |-
        Xác thực email và mật khẩu, cấp phiên qua cookie httpOnly. Phản hồi gồm người dùng, `csrfToken` và `redirectTo` theo vai trò. Thông báo sai thông tin dùng chung, không tiết lộ email có tồn tại hay không.

        **Quyền:** công khai (không cần đăng nhập).

        **Lỗi nghiệp vụ:**
        - `401 INVALID_CREDENTIALS`: Email hoặc mật khẩu không đúng.
        - `423 ACCOUNT_LOCKED`: Sai quá 5 lần trong 10 phút (khóa tạm 15 phút) hoặc bị admin khóa; details.lockedUntil.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Thành công
          headers:
            Set-Cookie:
              description: access_token và refresh_token (httpOnly, Secure, SameSite=Lax). BFF gắn vào cookie của trình duyệt,
                không trả cho JS.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Đăng xuất
      description: |-
        Hủy phiên và xóa cookie.

        **Quyền:** Ứng viên, Nhà tuyển dụng, Quản trị viên.
      security:
      - cookieAuth: []
        csrfToken: []
      x-roles:
      - candidate
      - recruiter
      - admin
      responses:
        '204':
          description: Đã đăng xuất.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshSession
      summary: Làm mới phiên
      description: |-
        Dùng cookie `refresh_token` để cấp lại `access_token`. Gọi khi nhận `401 SESSION_EXPIRED` trước khi chuyển người dùng về trang đăng nhập.

        **Quyền:** dùng cookie phiên làm mới (refresh_token).

        **Lỗi nghiệp vụ:**
        - `401 SESSION_EXPIRED`: Refresh token hết hạn hoặc bị thu hồi.
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Thành công
          headers:
            Set-Cookie:
              description: access_token và refresh_token (httpOnly, Secure, SameSite=Lax). BFF gắn vào cookie của trình duyệt,
                không trả cho JS.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/csrf:
    get:
      tags:
      - Auth
      operationId: getCsrfToken
      summary: Lấy CSRF token
      description: |-
        Cấp (hoặc xoay vòng) CSRF token cho phiên hiện tại.

        **Quyền:** Ứng viên, Nhà tuyển dụng, Quản trị viên.
      security:
      - cookieAuth: []
      x-roles:
      - candidate
      - recruiter
      - admin
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/forgot-password:
    post:
      tags:
      - Auth
      operationId: forgotPassword
      summary: Yêu cầu khôi phục mật khẩu
      description: |-
        Gửi liên kết khôi phục qua email. Luôn trả 202 dù email có tồn tại hay không (chống dò tài khoản).

        **Quyền:** công khai (không cần đăng nhập).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/reset-password:
    post:
      tags:
      - Auth
      operationId: resetPassword
      summary: Đặt lại mật khẩu bằng token
      description: |-
        Đặt mật khẩu mới từ token trong email. Token dùng một lần.

        **Quyền:** công khai (không cần đăng nhập).

        **Lỗi nghiệp vụ:**
        - `400 INVALID_RESET_TOKEN`: Token không hợp lệ hoặc đã hết hạn.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/change-password:
    post:
      tags:
      - Auth
      operationId: changePassword
      summary: Đổi mật khẩu
      description: |-
        Đổi mật khẩu khi đã đăng nhập. Các phiên khác của người dùng bị thu hồi.

        **Quyền:** Ứng viên, Nhà tuyển dụng, Quản trị viên.

        **Lỗi nghiệp vụ:**
        - `400 CURRENT_PASSWORD_INCORRECT`: Mật khẩu hiện tại không đúng.
      security:
      - cookieAuth: []
        csrfToken: []
      x-roles:
      - candidate
      - recruiter
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      tags:
      - Account
      operationId: getMe
      summary: Thông tin tài khoản hiện tại
      description: |-
        Dùng để khởi tạo session phía FE và kiểm tra vai trò.

        **Quyền:** Ứng viên, Nhà tuyển dụng, Quản trị viên.
      security:
      - cookieAuth: []
      x-roles:
      - candidate
      - recruiter
      - admin
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Account
      operationId: updateMe
      summary: Cập nhật thông tin tài khoản
      description: |-
        Cập nhật họ tên, số điện thoại, địa chỉ.

        **Quyền:** Ứng viên, Nhà tuyển dụng, Quản trị viên.
      security:
      - cookieAuth: []
        csrfToken: []
      x-roles:
      - candidate
      - recruiter
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/avatar:
    put:
      tags:
      - Account
      operationId: uploadAvatar
      summary: Tải ảnh đại diện
      description: |-
        Ảnh PNG/JPEG/WebP, tối đa 2 MB.

        **Quyền:** Ứng viên, Nhà tuyển dụng, Quản trị viên.

        **Lỗi nghiệp vụ:**
        - `413 PAYLOAD_TOO_LARGE`: Ảnh vượt giới hạn.
        - `415 UNSUPPORTED_MEDIA_TYPE`: Không phải ảnh hợp lệ.
      security:
      - cookieAuth: []
        csrfToken: []
      x-roles:
      - candidate
      - recruiter
      - admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Account
      operationId: deleteAvatar
      summary: Xóa ảnh đại diện
      description: '**Quyền:** Ứng viên, Nhà tuyển dụng, Quản trị viên.'
      security:
      - cookieAuth: []
        csrfToken: []
      x-roles:
      - candidate
      - recruiter
      - admin
      responses:
        '204':
          description: Đã xóa.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/export:
    get:
      tags:
      - Account
      operationId: exportMyData
      summary: Xuất bản sao dữ liệu cá nhân
      description: |-
        Quyền minh bạch dữ liệu (Nghị định 13/2023/NĐ-CP): xuất toàn bộ dữ liệu cá nhân và CV ở dạng PDF hoặc JSON.

        **Quyền:** Ứng viên, Nhà tuyển dụng, Quản trị viên.
      security:
      - cookieAuth: []
      x-roles:
      - candidate
      - recruiter
      - admin
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - pdf
          default: json
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/delete:
    post:
      tags:
      - Account
      operationId: deleteMyAccount
      summary: Xóa vĩnh viễn tài khoản và dữ liệu
      description: |-
        Quyền được lãng quên: xóa vĩnh viễn tài khoản, hồ sơ và CV. Không thể hoàn tác. Yêu cầu xác thực lại bằng mật khẩu.

        **Quyền:** Ứng viên, Nhà tuyển dụng, Quản trị viên.

        **Lỗi nghiệp vụ:**
        - `400 CURRENT_PASSWORD_INCORRECT`: Mật khẩu xác nhận không đúng.
      security:
      - cookieAuth: []
        csrfToken: []
      x-roles:
      - candidate
      - recruiter
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Đã xóa.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /candidate/dashboard:
    get:
      tags:
      - Candidate Profile
      operationId: getCandidateDashboard
      summary: Tổng quan của ứng viên
      description: |-
        Số liệu cho trang tổng quan: mức hoàn thiện hồ sơ, số CV, hồ sơ ứng tuyển theo trạng thái, lịch phỏng vấn sắp tới, việc làm gợi ý.

        **Quyền:** Ứng viên.
